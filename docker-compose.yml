services:
  postgres:
    # pgvector = Postgres + vector search (for RAG embeddings)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bleedstop
      POSTGRES_PASSWORD: bleedstop
      POSTGRES_DB: bleedstop
    ports:
      # Host 5434 — 5432/5433 often taken by local / other Docker Postgres
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bleedstop -d bleedstop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bleedstop:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      BLEEDSTOP_ROLE: api
      UNPAID_CEILING_USD: 5
      GHOST_THRESHOLD_USD: 1
      RAG_ENABLED: "1"
      DATABASE_URL: postgres://bleedstop:bleedstop@postgres:5432/bleedstop
      REDIS_URL: redis://redis:6379
      TENANT_ID: local-docker
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  reconciler:
    build: .
    command: ["npm", "run", "worker:reconciler"]
    environment:
      BLEEDSTOP_ROLE: reconciler
      RECONCILE_INTERVAL_MS: "15000"
      RAG_ENABLED: "1"
      DATABASE_URL: postgres://bleedstop:bleedstop@postgres:5432/bleedstop
      REDIS_URL: redis://redis:6379
      TENANT_ID: local-docker
    depends_on:
      postgres:
        condition: service_healthy
      bleedstop:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
