apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: bleedstop
type: Opaque
stringData:
  # Local kind only. Not a real password and not read from .env.
  POSTGRES_PASSWORD: bleedstop-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: bleedstop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: bleedstop
            - name: POSTGRES_DB
              value: bleedstop
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bleedstop"]
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bleedstop
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
