# Classifier sidecar. The image is built from services/classifier.
# Left out of kustomization.yaml until that image exists, so a kind apply
# does not wait on a missing image. The race test does not need it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifier
  namespace: bleedstop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: classifier
  template:
    metadata:
      labels:
        app: classifier
    spec:
      containers:
        - name: classifier
          image: bleedstop-classifier:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8099
          env:
            - name: PORT
              value: "8099"
          readinessProbe:
            httpGet:
              path: /health
              port: 8099
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: classifier
  namespace: bleedstop
spec:
  selector:
    app: classifier
  ports:
    - port: 8099
      targetPort: 8099
