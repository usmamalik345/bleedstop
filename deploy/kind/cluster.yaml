kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bleedstop
networking:
  # iptables mode needs the xt_statistic match for Service load balancing; on kernels without
  # it kube-proxy fails to program ClusterIPs ("RULE_APPEND failed"). nftables mode avoids it.
  kubeProxyMode: "nftables"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
