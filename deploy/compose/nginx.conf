worker_processes auto;
events { worker_connections 4096; }
http {
  access_log off;
  # Docker DNS: re resolve so scaled/restarted replicas are picked up
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream bleedstop {
    zone bleedstop 64k;
    server api:3000 resolve max_fails=1 fail_timeout=2s;
    keepalive 256;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://bleedstop;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
