apiVersion: v1
kind: Secret
metadata:
  name: bleedstop-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bleedstop.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@bleedstop-postgres:5432/{{ .Values.postgres.database }}"
  REDIS_URL: "redis://bleedstop-redis:6379"
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
