apiVersion: v1
kind: ConfigMap
metadata:
  name: bleedstop-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bleedstop.labels" . | nindent 4 }}
data:
  UNPAID_CEILING_USD: {{ .Values.config.unpaidCeilingUsd | quote }}
  GHOST_THRESHOLD_USD: {{ .Values.config.ghostThresholdUsd | quote }}
  RAG_ENABLED: {{ .Values.config.ragEnabled | quote }}
  TENANT_ID: {{ .Values.config.tenantId | quote }}
  RECONCILE_INTERVAL_MS: {{ .Values.config.reconcileIntervalMs | quote }}
  PORT: "3000"
  PG_REQUIRED: {{ .Values.config.pgRequired | quote }}
  SHUTDOWN_DRAIN_MS: {{ .Values.config.shutdownDrainMs | quote }}
  DECIDE_RATE_PER_SEC: {{ .Values.config.decideRatePerSec | quote }}
  LOG_FORMAT: "json"
