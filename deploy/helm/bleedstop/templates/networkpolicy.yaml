{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bleedstop-default-deny
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bleedstop.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# API: accept HTTP, talk to postgres/redis/DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bleedstop-api-allow
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: bleedstop-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: bleedstop-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: bleedstop-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Workers/jobs: no inbound; talk to API + DB/Redis/DNS only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bleedstop-workers-allow
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - bleedstop-reconciler
          - bleedstop-ingest
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: bleedstop-api
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
    - to:
        - podSelector:
            matchLabels:
              app: bleedstop-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: bleedstop-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Data stores: the default deny above also blocked INGRESS to postgres/redis, so the API could
# never connect once a NetworkPolicy capable CNI enforced it. Allow only API + workers in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bleedstop-datastores-allow
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - bleedstop-postgres
          - bleedstop-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - bleedstop-api
                  - bleedstop-reconciler
                  - bleedstop-ingest
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
{{- end }}

