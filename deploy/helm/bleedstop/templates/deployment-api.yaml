apiVersion: apps/v1
kind: Deployment
metadata:
  name: bleedstop-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bleedstop.labels" . | nindent 4 }}
    app: bleedstop-api
spec:
  {{- if not .Values.hpa.enabled }}
  # with HPA on, the HPA owns replicas (a fixed value here would reset it on every upgrade)
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: bleedstop-api
  template:
    metadata:
      labels:
        app: bleedstop-api
        {{- include "bleedstop.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: {{ .Values.podSecurity.runAsNonRoot }}
        runAsUser: {{ .Values.podSecurity.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: BLEEDSTOP_ROLE
              value: api
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: bleedstop-config
            - secretRef:
                name: bleedstop-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.podSecurity.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          # startup gates the other two while migrations + hydration run
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          # readiness: 503 while booting or draining (SIGTERM), so endpoints drop the pod first
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 1
          # liveness: process only, never dependencies (a Redis/Postgres blip must not restart pods)
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: bleedstop-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bleedstop.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: bleedstop-api
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.api.port }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
{{- if .Values.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bleedstop-api
  namespace: {{ .Values.namespace }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: bleedstop-api
{{- end }}
