# BleedStop observability stack: OTel Collector -> Tempo (traces) + Prometheus (metrics, span metrics) -> Grafana.
# BleedStop itself runs on the host:  OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 npm start
#   docker compose -f deploy/observability/docker-compose.yml up -d   then open http://localhost:3300 (anonymous viewer)
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./tempo.yaml:/etc/tempo.yaml:ro"]
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bleedstop.json
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro", "./grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    ports: ["3300:3000"]
    depends_on: [prometheus, tempo]
